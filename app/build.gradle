plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carbusiness.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carbusiness.app'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '10.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}


dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.biometric:biometric:1.1.0'
}
